<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PermitIQ</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 30px auto; padding: 20px; }
    h1, h2 { margin-bottom: 10px; }
    form, .filters { display: grid; gap: 10px; margin-bottom: 20px; }
    input, button { padding: 10px; font-size: 14px; }
    button { cursor: pointer; }
    .permit { border: 1px solid #ccc; padding: 12px; margin-bottom: 10px; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>PermitIQ</h1>

  <h2>Create Permit</h2>
  <form id="permitForm">
    <input type="text" id="project_name" placeholder="Project Name" required />
    <input type="text" id="location" placeholder="Location" required />
    <input type="text" id="permit_type" placeholder="Permit Type" required />
    <button type="submit">Submit Permit</button>
  </form>

  <h2>Filter Permits</h2>
  <div class="filters">
    <input type="text" id="filter_location" placeholder="Filter by location" />
    <input type="text" id="filter_type" placeholder="Filter by permit type" />
    <button onclick="loadPermits()">Apply Filters</button>
  </div>

  <h2>Permits</h2>
  <div id="permitsList"></div>

  <script>
    const API_BASE = "https://super-duper-winner-7g6p9ppxr45cpr4r-8000.app.github.dev";

    async function loadPermits() {
      const location = document.getElementById("filter_location").value.trim();
      const permitType = document.getElementById("filter_type").value.trim();

      const params = new URLSearchParams();
      if (location) params.append("location", location);
      if (permitType) params.append("permit_type", permitType);

      const response = await fetch(`${API_BASE}/permits?${params.toString()}`);
      const permits = await response.json();

      const permitsList = document.getElementById("permitsList");
      permitsList.innerHTML = "";

      permits.forEach(permit => {
        const div = document.createElement("div");
        div.className = "permit";
        div.innerHTML = `
          <strong>ID:</strong> ${permit.id}<br>
          <strong>Project:</strong> ${permit.project_name}<br>
          <strong>Location:</strong> ${permit.location}<br>
          <strong>Type:</strong> ${permit.permit_type}
        `;
        permitsList.appendChild(div);
      });
    }

    document.getElementById("permitForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const payload = {
        project_name: document.getElementById("project_name").value.trim(),
        location: document.getElementById("location").value.trim(),
        permit_type: document.getElementById("permit_type").value.trim()
      };

      await fetch(`${API_BASE}/permits`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      document.getElementById("permitForm").reset();
      loadPermits();
    });

    loadPermits();
  </script>
</body>
</html>
